# docs-rag-llm -- OPTIONAL Ingress (TLS + edge limits):  kubectl apply -f k8s-ingress.yaml
# 1. replace host `model.example.com`;  2. create the TLS secret once:  kubectl create secret tls docs-rag-llm-tls --cert=tls.crt --key=tls.key
#    (or let cert-manager issue it: add the `cert-manager.io/cluster-issuer` annotation);  3. match ingressClassName to your controller.
# limit-rpm is per client IP and shared by every pod behind this Ingress (the in-app limiter is per pod and per API key).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docs-rag-llm-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/limit-rpm: "600"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [model.example.com]
      secretName: docs-rag-llm-tls
  rules:
    - host: model.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docs-rag-llm-service
                port:
                  number: 80
